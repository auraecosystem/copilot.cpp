name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        # Deliberately no -G: runner images rotate their Visual Studio version, and pinning
        # one ("Visual Studio 17 2022") breaks the Windows job the moment the image moves on.
        # CMake's per-platform default is correct on all three runners.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPILOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build -C Release -E "^E2ETest\." --output-on-failure
        env:
          COPILOT_SDK_CPP_SKIP_E2E: 1
